name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image-matrix:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - name: Emit canonical image matrix
        id: matrix
        run: |
          echo "value=$(jq -c '{include: [.images[]]}' release/images.json)" >> "$GITHUB_OUTPUT"

  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: software_factory
          POSTGRES_PASSWORD: software_factory
          POSTGRES_DB: software_factory
        options: >-
          --health-cmd "pg_isready -U software_factory -d software_factory"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19
      - uses: extractions/setup-just@v3
      - name: Install pinned generators and linter
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - name: Verify pinned contributor toolchain
        run: just bootstrap
      - name: Install console dependencies
        run: bun install --cwd web --frozen-lockfile
      - name: Verify active standalone tree
        env:
          SOFTWARE_FACTORY_DATABASE_URL: postgresql://software_factory:software_factory@localhost:5432/software_factory?sslmode=disable
        run: just verify

  temporal-session:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run real Temporal Session integration
        run: go test -race -count=1 -tags=integration ./internal/runworkercapability

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: extractions/setup-just@v3
      - name: Run durable AgentWorkflow E2E
        run: just e2e
      - name: Upload machine-checkable E2E result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: software-factory-e2e-result
          path: .artifacts/e2e/result.json
          if-no-files-found: error

  images:
    needs: [image-matrix, verify, temporal-session, e2e]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.image-matrix.outputs.value) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          push: false
          tags: software-factory-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Smoke-test Run Worker contract
        if: matrix.name == 'run-worker'
        run: images/run-worker/smoke.sh software-factory-run-worker:ci
